services:
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-service:
    build: .
    image: booking-service:latest
    ports:
      - "8081:8081"
    environment:
      PGHOST: booking-db
      PGPORT: 5432
      PGDATABASE: bookingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      booking-db:
        condition: service_healthy

volumes:
  booking-db-data:
