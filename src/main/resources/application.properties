spring.application.name=booking-service
server.port=${PORT:8081}
# Railway terminates TLS and forwards X-Forwarded-*, without this Location headers say http://.
server.forward-headers-strategy=native

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bookingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# The liveness group answers whether the process is up, readiness also checks the database.
management.endpoint.health.probes.enabled=true
