spring.application.name=booking-service
server.port=${PORT:8081}
# Render terminates TLS and forwards X-Forwarded-*, without this Location headers say http://.
server.forward-headers-strategy=native

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# schema-postgresql.sql runs before Hibernate and removes the customer table left over from
# Backend 1. The separator is ;; because the script holds a DO block with semicolons inside.
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.separator=;;

# Same three values as the customer service, which issues the tokens.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=pensionat-customer-service
app.jwt.audience=pensionat

customer.service.url=${CUSTOMER_SERVICE_URL}
# Leave unset to run booking without the notification service.
notification.service.url=${NOTIFICATION_SERVICE_URL:}

# The liveness group answers whether the process is up, readiness also checks the database.
management.endpoint.health.probes.enabled=true
